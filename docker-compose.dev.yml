# Dev-mode override.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Bind-mounts ./backend and ./frontend so source edits trigger hot-reload
# (node --watch for backend, next dev for frontend) — no `docker compose build` needed.

services:
  backend:
    build:
      context: ./backend
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules     # anonymous volume preserves container-installed deps
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      target: development
      # NEXT_PUBLIC_API_URL build-arg unused in dev — Next reads env vars at runtime
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      WATCHPACK_POLLING: "true"       # reliable file-watch on Docker Desktop (Windows/macOS)
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
