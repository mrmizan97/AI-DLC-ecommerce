# Dev compose — fully standalone (no docker-compose.yml needed).
# Backend and frontend run in hot-reload mode (node --watch / next dev) with
# the host source bind-mounted, so code edits reload in ~1s without rebuild.
# Same observability + CI stack as production.
#
# Run:
#   docker compose -f docker-compose.dev.yml up -d
#
# Note: dev volumes are kept separate from prod (db_data_dev, etc.) so the two
# stacks can coexist without overwriting each other's data.

services:

  # ── MySQL Database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ai_dlc_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-ai_dlc_crud}
    ports:
      - "3308:3306"
    volumes:
      - db_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Backend API (node --watch hot reload) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: development
    container_name: ai_dlc_backend_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ai_dlc_crud}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4001}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:4000}
      SSLCZ_STORE_ID: ${SSLCZ_STORE_ID:-testbox}
      SSLCZ_STORE_PASSWORD: ${SSLCZ_STORE_PASSWORD:-qwerty}
      SSLCZ_IS_LIVE: ${SSLCZ_IS_LIVE:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules     # anonymous volume preserves container-installed deps
      - uploads_dev:/app/uploads

  # ── Frontend Next.js (next dev with HMR) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: ai_dlc_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      WATCHPACK_POLLING: "true"        # reliable file-watch on Docker Desktop (Windows/macOS)
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "4001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # ── Prometheus (metrics TSDB) ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai_dlc_prometheus_dev
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_dev:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"

  # ── Loki (log storage / query) ───────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: ai_dlc_loki_dev
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data_dev:/loki
    ports:
      - "3100:3100"

  # ── Promtail (ships Docker container logs to Loki) ───────────────────────────
  promtail:
    image: grafana/promtail:2.9.4
    container_name: ai_dlc_promtail_dev
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ── Jenkins (CI/CD via JCasC) ────────────────────────────────────────────────
  jenkins:
    build:
      context: ./jenkins
    container_name: ai_dlc_jenkins_dev
    restart: unless-stopped
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin123}
    ports:
      - "8091:8080"
      - "50001:50000"
    volumes:
      - jenkins_home_dev:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:rw

  # ── Grafana (dashboards + logs UI) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ai_dlc_grafana_dev
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3003:3000"
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

# ── Named Volumes (separate from prod so the two stacks don't collide) ──────
volumes:
  db_data_dev:
  uploads_dev:
  prometheus_data_dev:
  grafana_data_dev:
  loki_data_dev:
  jenkins_home_dev:
